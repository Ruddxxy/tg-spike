[package]
name = "miner-sim"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "miner_sim"
path = "src/lib.rs"

[[bin]]
name = "miner-sim"
path = "src/main.rs"

[dependencies]
# host-runner gives the wasmtime driver. The simulator scores every
# response through the WASM boundary, not through native Rust. Only the
# compiled module tells the truth about what a validator will do.
host-runner = { path = "../host-runner" }
# anyhow gives host-side error handling with context.
anyhow = "1"
# serde_json builds the response strings with correct escapes.
serde_json = "1"

# This crate does NOT depend on the `rand` crate. It uses a small PRNG
# that this crate holds in `rng.rs`. A local PRNG keeps the output the
# same for a given seed forever, across every machine and every version.
