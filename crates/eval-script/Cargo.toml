[package]
name = "eval-script"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# serde_json compiles into this module as pure Rust code.
# It does not use host imports. This keeps the score deterministic.
# It also has a correctly-rounded float parser. A hand-rolled parser
# would not give that guarantee.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
