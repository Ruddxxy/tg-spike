name: org-watcher

# NOTE: GitHub's scheduled runners are unreliable under load. A "*/15" cron
# run can be skipped or delayed by 10+ minutes when the queue is busy.
# This is tolerated by design: the state file the script writes is a full
# snapshot of what has been seen, not a time cursor, so a delayed or
# skipped run never loses track of where it left off.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no ntfy send, no state write)"
        type: boolean
        default: false

# Two overlapping runs must never both push a state file. We do not cancel
# a run in flight, because it may be mid-push and a cancel could leave the
# state file or the git working tree half-written.
concurrency:
  group: org-watcher
  cancel-in-progress: false

permissions:
  contents: write

env:
  # The script shells out to `git ls-remote` against repositories that may
  # not exist. Without this, a missing/private repo can trigger a credential
  # prompt that hangs the runner until the job times out.
  GIT_TERMINAL_PROMPT: 0

jobs:
  watch:
    runs-on: ubuntu-latest
    # Kept low so a hung run cannot block the next scheduled run 15 minutes later.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python3 -m unittest discover -s tools/org-watcher

      - name: Run watcher
        id: watcher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set +e
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python3 tools/org-watcher/watcher.py --dry-run
          else
            python3 tools/org-watcher/watcher.py
          fi
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # The commit step runs on ANY exit code, and keys only on
      # state_changed. The script alone decides what it writes. On a
      # hard failure it writes nothing at all, except in one case: a
      # failed account listing, where it saves the raised rate-limit
      # failure counter and keeps every other value as it was. That
      # counter must survive to the next run, or the "watcher is blind"
      # alert can never reach 3 in a row. An earlier version skipped the
      # commit on exit 1 and threw that counter away every time.
      - name: Commit and push state file
        id: commit
        if: steps.watcher.outputs.state_changed == 'true'
        run: |
          set -e

          # The output name uses an underscore. A GitHub Actions
          # expression reads a hyphen as the subtraction operator, so
          # "outputs.state-changed" would never match.
          if [ "${{ steps.watcher.outputs.state_changed }}" != "true" ]; then
            echo "State unchanged; nothing to commit."
            exit 0
          fi

          git config user.name "org-watcher-bot"
          git config user.email "org-watcher-bot@users.noreply.github.com"

          STATE_PATH="tools/org-watcher/state/watcher-state.json"
          BRANCH="${GITHUB_REF_NAME}"

          git add "$STATE_PATH"

          if git diff --cached --quiet; then
            echo "No staged changes for $STATE_PATH; nothing to commit."
            exit 0
          fi

          # Commit ONCE, outside the retry loop. An earlier version
          # committed inside the loop. On the second pass nothing was
          # staged any more, so the loop reported "nothing to commit"
          # and exited 0, and the state commit was never pushed. That
          # lost the state on every push race.
          git commit -m "chore: update org-watcher state [skip ci]"

          attempt=1
          max_attempts=5
          while [ "$attempt" -le "$max_attempts" ]; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "Pushed state on attempt $attempt."
              exit 0
            fi

            echo "Push failed on attempt $attempt. Another run probably pushed first. Rebase and try again."
            git fetch origin "$BRANCH"
            # Rebase onto the named branch. "origin/HEAD" is not always
            # set in an Actions checkout, so it is not safe to use.
            if ! git rebase "origin/${BRANCH}"; then
              echo "The rebase failed. Abort it and stop without a push." >&2
              git rebase --abort || true
              exit 1
            fi

            attempt=$((attempt + 1))
          done

          echo "The push failed $max_attempts times. The next run writes the state again." >&2
          exit 1

      - name: Fail run if watcher hit a hard failure
        if: steps.watcher.outputs.exit_code == '1'
        run: |
          echo "watcher.py exited 1 (hard failure). It did not write repo state." >&2
          echo "Read the job summary above for the cause." >&2
          exit 1

      - name: Flag ntfy delivery failure
        if: steps.watcher.outputs.exit_code == '2'
        run: |
          echo "watcher.py exited 2: state was written and committed, but an ntfy delivery failed after retries." >&2
          exit 1
